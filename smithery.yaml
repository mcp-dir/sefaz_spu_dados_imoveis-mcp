# Smithery configuration for SEFAZ SPU: Dados Cadastrais de Imóvel da União
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_sefaz_spu_dados_imoveis

name: sefaz_spu_dados_imoveis-mcp
displayName: "SEFAZ SPU: Dados Cadastrais de Imóvel da União"
description: >
  SEFAZ SPU: Dados Cadastrais de Imóvel da União, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/sefaz_spu_dados_imoveis-mcp
repository: https://github.com/mcp-dir/sefaz_spu_dados_imoveis-mcp

tags:
  - sefaz_spu_dados_imoveis
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_sefaz_spu_dados_imoveis

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_sefaz_spu_dados_imoveis/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
